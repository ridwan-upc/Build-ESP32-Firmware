; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17

; ============================================================
; Development channel
; - Manifest URL: dev release
; - Version check: SHA256 (allow same version, different build)
; - Signing: not required
; ============================================================
[env:esp32-dev]
extends = env
build_flags = 
    -D MANIFEST_URL=\"https://github.com/ridwan-upc/Build-ESP32-Firmware/releases/download/dev/manifest.json\"
    -D VERSION_CHECK_MODE=0

; ============================================================
; Staging channel
; - Manifest URL: staging release
; - Version check: version OR SHA256
; - Signing: required
; ============================================================
[env:esp32-staging]
extends = env
build_flags = 
    -D MANIFEST_URL=\"https://github.com/ridwan-upc/Build-ESP32-Firmware/releases/download/staging/manifest.json\"
    -D VERSION_CHECK_MODE=1

; ============================================================
; Production channel
; - Manifest URL: latest release
; - Version check: version only
; - Signing: required
; ============================================================
[env:esp32-production]
extends = env
build_flags = 
    -D MANIFEST_URL=\"https://github.com/ridwan-upc/Build-ESP32-Firmware/releases/latest/download/manifest.json\"
    -D VERSION_CHECK_MODE=2