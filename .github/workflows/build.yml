name: Build ESP32 Firmware

on:
  push:
    branches: [main]
    tags:
      - 'v*'          # Production release
      - 'staging-*'   # Staging release
      - 'dev-*'       # Dev release
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # Determine environment based on trigger
      # ============================================================
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=production" >> $GITHUB_OUTPUT
            echo "pio_env=esp32-production" >> $GITHUB_OUTPUT
            echo "sign=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "static_tag=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/staging-* ]]; then
            echo "channel=staging" >> $GITHUB_OUTPUT
            echo "pio_env=esp32-staging" >> $GITHUB_OUTPUT
            echo "sign=true" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "static_tag=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/dev-* ]]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
            echo "pio_env=esp32-dev" >> $GITHUB_OUTPUT
            echo "sign=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "static_tag=dev" >> $GITHUB_OUTPUT
          else
            echo "channel=dev" >> $GITHUB_OUTPUT
            echo "pio_env=esp32-dev" >> $GITHUB_OUTPUT
            echo "sign=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "release_tag=dev" >> $GITHUB_OUTPUT
            echo "static_tag=" >> $GITHUB_OUTPUT
          fi
          
          echo "Channel: ${{ steps.env.outputs.channel }}"
          echo "PlatformIO env: ${{ steps.env.outputs.pio_env }}"
          echo "Sign: ${{ steps.env.outputs.sign }}"

      # ============================================================
      # Setup tools
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install esptool
        run: pip install esptool

      # ============================================================
      # Build firmware for the correct environment
      # ============================================================
      - name: Build firmware
        run: pio run -e ${{ steps.env.outputs.pio_env }}

      # ============================================================
      # Sign firmware (staging + production only)
      # ============================================================
      - name: Decode signing key
        if: steps.env.outputs.sign == 'true'
        run: |
          echo "${{ secrets.FIRMWARE_SIGNING_KEY }}" | base64 -d > private_key.pem
          ls -la private_key.pem

      - name: Sign firmware
        if: steps.env.outputs.sign == 'true'
        run: |
          python -m espsecure sign-data \
            --version 2 \
            --keyfile private_key.pem \
            --output firmware-signed.bin \
            .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin
          
          mv firmware-signed.bin .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin
          
          rm -f private_key.pem
          echo "✅ Firmware signed"
          ls -la .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin

      # ============================================================
      # Generate manifest (tag only)
      # ============================================================
      - name: Generate manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${{ steps.env.outputs.release_tag }}
          STATIC_TAG=${{ steps.env.outputs.static_tag }}
          
          # URL firmware pakai static_tag (untuk URL statis)
          if [ -n "$STATIC_TAG" ]; then
            URL="https://github.com/${{ github.repository }}/releases/download/${STATIC_TAG}/firmware.bin"
          else
            URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/firmware.bin"
          fi
          
          SHA256=$(sha256sum .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin | awk '{print $1}')
          
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${URL}",
            "sha256": "${SHA256}",
            "channel": "${{ steps.env.outputs.channel }}",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          cat manifest.json

      # ============================================================
      # Upload artifact (always)
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ steps.env.outputs.channel }}-${{ github.sha }}
          path: .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin
          retention-days: 30

      # ============================================================
      # Create release (tag only)
      # ============================================================
      - name: Create Release (versioned)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.env.outputs.release_tag }}
          files: |
            .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin
            .pio/build/${{ steps.env.outputs.pio_env }}/firmware.elf
            manifest.json
          prerelease: ${{ steps.env.outputs.prerelease}}
          generate_release_notes: true

      - name: Delete existing static release
        if: steps.env.outputs.static_tag != ''
        continue-on-error: true
        run: |
          gh release delete ${{ steps.env.outputs.static_tag }} --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Static Release (for stable URL)
        if: steps.env.outputs.static_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.env.outputs.static_tag }}
          files: |
            .pio/build/${{ steps.env.outputs.pio_env }}/firmware.bin
            .pio/build/${{ steps.env.outputs.pio_env }}/firmware.elf
            manifest.json
          prerelease: true
          body: |
            Static release for ${{ steps.env.outputs.channel }} channel.
            Points to: ${{ steps.env.outputs.release_tag }}
          generate_release_notes: false

      - name: Run benchmark
        if: steps.env.outputs.channel == 'production'
        run: |
          # Measure — butuh 1 argumen (env)
          python benchmarks/benchmark.py ${{ steps.env.outputs.pio_env }} > current.json
          cat current.json
          
          # Compare — butuh 2 argumen (current, baseline)
          if [ -f benchmarks/baseline.json ]; then
            python benchmarks/compare.py current.json benchmarks/baseline.json
          else
            echo "⚠️ No baseline found — skipping comparison"
          fi