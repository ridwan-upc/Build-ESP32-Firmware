name: Build ESP32 Firmware

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install esptool
        run: pip install esptool

      - name: Build firmware
        run: pio run -e esp32doit-devkit-v1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/esp32doit-devkit-v1/firmware.bin

      - name: Create Release (for hardware)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/esp32doit-devkit-v1/firmware.bin
            .pio/build/esp32doit-devkit-v1/firmware.elf
          generate_release_notes: true

      - name: Generate manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=$(sha256sum .pio/build/esp32doit-devkit-v1/firmware.bin | awk '{print $1}')
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/firmware.bin"
          
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${URL}",
            "sha256": "${SHA256}",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_notes": "Release v${VERSION}",
            "min_version": "1.0.0"
          }
          EOF
          
          cat manifest.json
